name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup toolchain install nightly-2026-05-20 --profile minimal --component rust-src
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo +stable fmt --manifest-path crates/sentinella-ebpf/Cargo.toml -- --check
      - name: Build eBPF object
        run: |
          bash scripts/install-bpf-linker.sh
          cargo xtask build-ebpf
      - name: Build frontend assets for Tauri
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p sentinella-tauri
